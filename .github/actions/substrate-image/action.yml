name: Pinned Substrate image
description: Build and check one pinned source image; only the main publish job can sign it.
inputs:
  role:
    description: Fixed source image role from the workflow matrix
    required: true
  publish:
    description: Whether the canonical main job publishes this image
    required: true
  registry-token:
    description: Workflow token, supplied only by the publish job
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.3'
    - name: Install pinned Python dependencies
      shell: bash
      run: python3 -m pip install -r charts/aks-durable-agents/tests/requirements.txt
    - name: Check out the exact Substrate release source
      if: inputs.role != 'pause'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: agent-substrate/substrate
        ref: e8d40c33f96f4b7a4984bfea7334a36ab5b45b7b
        path: .build/substrate-source
        persist-credentials: false
    - name: Check out the exact pause source
      if: inputs.role == 'pause'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: kubernetes/kubernetes
        ref: f54c212e3a2f75d674b717a9b29052b20b60aefc
        path: .build/pause-source
        sparse-checkout: build/pause
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.role != 'pause' && inputs.role != 'envoy-dataplane'
      with:
        go-version-file: go.mod
        cache-dependency-path: .build/substrate-source/go.sum
    - name: Install the pinned strict Go vulnerability scanner
      if: inputs.role != 'pause' && inputs.role != 'envoy-dataplane'
      shell: bash
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.0
        driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    - name: Prepare checked source and image context
      id: prepare
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
      run: |
        python3 -B ops/images/substrate_images.py prepare --role "$ROLE" \
          --source .build/substrate-source --pause-source .build/pause-source \
          --output .build/substrate --revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: inputs.publish == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build
      with:
        context: ${{ steps.prepare.outputs.context }}
        file: ${{ steps.prepare.outputs.file }}
        platforms: linux/amd64
        # Only the upstream Rust/apt build needs network; all smoke runs are offline.
        network: ${{ inputs.role == 'envoy-dataplane' && 'default' || 'none' }}
        outputs: ${{ inputs.publish == 'true' && 'type=registry,rewrite-timestamp=true' || 'type=docker,rewrite-timestamp=true' }}
        tags: ${{ steps.prepare.outputs.image }}
        labels: |
          org.opencontainers.image.source=https://github.com/Azure/aks-durable-agents
          org.opencontainers.image.revision=${{ github.sha }}
          io.aks-durable-agents.substrate.source=e8d40c33f96f4b7a4984bfea7334a36ab5b45b7b
          io.aks-durable-agents.pause.source=f54c212e3a2f75d674b717a9b29052b20b60aefc
        build-args: SOURCE_DATE_EPOCH=${{ steps.prepare.outputs.epoch }}
        provenance: ${{ inputs.publish == 'true' && 'mode=max' || 'false' }}
        attests: ${{ inputs.publish == 'true' && 'type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9' || '' }}
    - name: Check the local image and all packaged Go code
      if: inputs.publish != 'true'
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        IMAGE: ${{ steps.prepare.outputs.image }}
      run: python3 -B ops/images/substrate_images.py smoke --role "$ROLE" --image "$IMAGE"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      if: inputs.publish == 'true'
      with:
        cosign-release: v3.1.3
    - name: Check the pushed digest before signing and recording it
      id: record
      if: inputs.publish == 'true'
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        python3 -B ops/images/substrate_images.py record --role "$ROLE" --digest "$DIGEST" \
          --revision "$GITHUB_SHA" --output .build/substrate-publication
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: inputs.publish == 'true'
      with:
        name: substrate-image-${{ inputs.role }}
        path: .build/substrate-publication/
        if-no-files-found: error
        retention-days: 30
