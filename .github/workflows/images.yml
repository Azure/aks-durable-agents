name: Images

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - charts/aks-durable-agents/values.yaml
  push:
    branches: [main]
    tags: ['v*']
    # A pin-only merge must not generate another revision-labelled image/pin PR.
    paths-ignore:
      - '**/*.md'
      - charts/aks-durable-agents/values.yaml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned strict Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make images
      - name: Smoke-test actual image commands without network
        run: bash ops/images/smoke.sh
      - name: Require clean scans of all packaged Go executables
        run: bash ops/images/vulncheck.sh

  publish:
    if: github.repository == 'Azure/aks-durable-agents' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify and build from the pinned module graph
        run: |
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod)"
          go mod download
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          go test -race ./...
          python3 -B -m unittest discover -s ops/images -p 'test_backup_helper.py'
          python3 -B -m unittest discover -s ops/images -p 'test_update_pins.py'
          make image-binaries
          govulncheck -mode=binary .build/images/host
          govulncheck -mode=binary .build/images/session-fixture
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare immutable source metadata
        id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          for role in host session-fixture backup-helper; do
            tags="ghcr.io/azure/aks-durable-agents/$role:sha-$GITHUB_SHA"
            if [[ "$REF_TYPE" == tag ]]; then
              [[ "$REF_NAME" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]
              tags="$tags,ghcr.io/azure/aks-durable-agents/$role:$REF_NAME"
            fi
            echo "$role=$tags" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: host
        with:
          context: .build/images
          file: images/Dockerfile
          target: host
          platforms: linux/amd64
          network: none
          outputs: type=registry,rewrite-timestamp=true
          tags: ${{ steps.source.outputs.host }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: fixture
        with:
          context: .build/images
          file: images/Dockerfile
          target: session-fixture
          platforms: linux/amd64
          network: none
          outputs: type=registry,rewrite-timestamp=true
          tags: ${{ steps.source.outputs.session-fixture }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: backup-helper
        with:
          context: ops/backup
          file: ops/backup/Dockerfile
          platforms: linux/amd64
          network: none
          outputs: type=registry,rewrite-timestamp=true
          tags: ${{ steps.source.outputs.backup-helper }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HOST_IMAGE=ghcr.io/azure/aks-durable-agents/host@${{ steps.host.outputs.digest }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Smoke-test the pushed image contents before signing
        env:
          HOST_DIGEST: ${{ steps.host.outputs.digest }}
          FIXTURE_DIGEST: ${{ steps.fixture.outputs.digest }}
          HELPER_DIGEST: ${{ steps.backup-helper.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "ghcr.io/azure/aks-durable-agents/host@$HOST_DIGEST"
          docker pull --platform linux/amd64 "ghcr.io/azure/aks-durable-agents/session-fixture@$FIXTURE_DIGEST"
          docker tag "ghcr.io/azure/aks-durable-agents/host@$HOST_DIGEST" local/aks-durable-agents/host:local
          docker tag "ghcr.io/azure/aks-durable-agents/session-fixture@$FIXTURE_DIGEST" local/aks-durable-agents/session-fixture:local
          docker pull --platform linux/amd64 "ghcr.io/azure/aks-durable-agents/backup-helper@$HELPER_DIGEST"
          bash ops/images/smoke.sh local/aks-durable-agents "ghcr.io/azure/aks-durable-agents/backup-helper@$HELPER_DIGEST"
      - name: Require clean packaged-Go scans before signing
        env:
          HELPER_DIGEST: ${{ steps.backup-helper.outputs.digest }}
        run: bash ops/images/vulncheck.sh local/aks-durable-agents "ghcr.io/azure/aks-durable-agents/backup-helper@$HELPER_DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign digests and record SBOMs
        env:
          HOST_DIGEST: ${{ steps.host.outputs.digest }}
          FIXTURE_DIGEST: ${{ steps.fixture.outputs.digest }}
          HELPER_DIGEST: ${{ steps.backup-helper.outputs.digest }}
        run: |
          mkdir -p .build/publication
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'ops/images')
          from update_pins import validate_manifest
          data = {'version': 1, 'sourceCommit': os.environ['GITHUB_SHA'], 'images': {
              'host': {'repository': 'ghcr.io/azure/aks-durable-agents/host', 'digest': os.environ['HOST_DIGEST']},
              'harness': {'repository': 'ghcr.io/azure/aks-durable-agents/session-fixture', 'digest': os.environ['FIXTURE_DIGEST']}}}
          Path('.build/publication/images.json').write_text(json.dumps(validate_manifest(data), indent=2) + '\n')
          PY
          python3 -B ops/images/backup_helper.py create --source-commit "$GITHUB_SHA" \
            --host-digest "$HOST_DIGEST" --helper-digest "$HELPER_DIGEST" \
            --output .build/publication/backup-helper.json
          for pair in "host@$HOST_DIGEST" "session-fixture@$FIXTURE_DIGEST" "backup-helper@$HELPER_DIGEST"; do
            ref="ghcr.io/azure/aks-durable-agents/$pair"
            name="${pair%%@*}"
            cosign sign --yes "$ref"
            cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/images.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > ".build/publication/$name-signature.json"
            docker buildx imagetools inspect "$ref" --format '{{json .SBOM.SPDX}}' > ".build/publication/$name-sbom.json"
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data, dict) and data.get("SPDXID") == "SPDXRef-DOCUMENT" and data.get("packages"), "missing SPDX SBOM"' ".build/publication/$name-sbom.json"
            echo "Published and signed $ref (SBOM attached)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-images
          path: .build/publication/
          if-no-files-found: error
          retention-days: 30

  substrate-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [ateapi, atecontroller, atelet, atenet, ateom-gvisor, objectstore-plugin, podcertcontroller, counter, envoy-dataplane, pause]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/substrate-image
        with:
          role: ${{ matrix.role }}
          publish: 'false'

  substrate-publish:
    if: github.repository == 'Azure/aks-durable-agents' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [ateapi, atecontroller, atelet, atenet, ateom-gvisor, objectstore-plugin, podcertcontroller, counter, envoy-dataplane, pause]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/substrate-image
        with:
          role: ${{ matrix.role }}
          publish: 'true'
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  substrate-collect:
    if: github.repository == 'Azure/aks-durable-agents' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: substrate-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.3'
      - name: Install pinned Python dependencies
        run: python3 -m pip install -r charts/aks-durable-agents/tests/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: substrate-image-*
          path: .build/substrate-receipts
          merge-multiple: true
      - name: Record the complete checked installer map
        run: |
          python3 -B ops/images/substrate_images.py collect --receipts .build/substrate-receipts \
            --revision "$GITHUB_SHA" --output .build/substrate-publication
          echo 'Substrate v0.5.0 map: download published-substrate-images; use only after public pin verification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-substrate-images
          path: .build/substrate-publication/
          if-no-files-found: error
          retention-days: 30
