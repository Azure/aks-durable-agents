version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Upgrade needs durability qualification (async suspend default) first.
      - dependency-name: github.com/agent-substrate/substrate
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /charts/aks-durable-agents/tests
    schedule:
      interval: weekly
