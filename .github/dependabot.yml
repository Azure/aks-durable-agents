version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /proofs/squadbackend
    schedule:
      interval: weekly
    groups:
      shared-go-modules:
        group-by: dependency-name
        patterns: ["*"]
    ignore:
      # Upgrade needs durability qualification (async suspend default) first.
      - dependency-name: github.com/agent-substrate/substrate
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /charts/aks-durable-agents/tests
    schedule:
      interval: weekly
