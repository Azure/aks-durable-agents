apiVersion: canvas.local/v1alpha2
kind: Canvas
metadata:
  name: compact-native-proof
  title: Compact fictional native producer proof
spec:
  documents:
    inputs: {path: inputs.md, title: Fictional source}
    notes: {path: notes.md, title: Compact notes}
    announcement: {path: announcement.md, title: Unpublished announcement}
    review: {path: review.md, title: Compact review}
  agents:
    writer:
      name: Writer protocol fixture
      suite: {ref: 'sha256:661a3b10f3f09e8fb7f2dc71a0df4694200222451cf39da27a3dbde7f38b5c1f', layout: layouts/writer, member: writer, platform: linux/amd64}
      read: [inputs, notes, announcement]
      propose: [notes, announcement]
    reviewer:
      name: Reviewer protocol fixture
      suite: {ref: 'sha256:60c3d5d677bf60ffe470a2792df94022aa51fe19e8446cf953f1576f32dbd15b', layout: layouts/reviewer, member: reviewer, platform: linux/amd64}
      read: [inputs, notes, announcement, review]
      propose: [review]
  seed:
    inputs.md: seeds/inputs.md
    notes.md: seeds/notes.md
    announcement.md: seeds/announcement.md
    review.md: seeds/review.md
  triggers:
    - {name: draft, type: manual, agent: writer}
    - {name: critique, type: manual, agent: reviewer}
  people:
    - {id: GM, name: Morgan, title: Fictional reviewer}
