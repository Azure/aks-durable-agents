apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agents.aks-durable-agents.io
spec:
  group: agents.aks-durable-agents.io
  scope: Namespaced
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [package, member, modelBindingRef]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Agent spec is immutable; create a new Agent
              properties:
                package:
                  type: object
                  required: [reference]
                  properties:
                    reference:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9.-]*(:[0-9]+)?/[a-z0-9]+(([.]|_{1,2}|-+)[a-z0-9]+)*(/[a-z0-9]+(([.]|_{1,2}|-+)[a-z0-9]+)*)*@sha256:[0-9a-f]{64}$'
                member: {type: string, minLength: 1}
                modelBindingRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, enum: [default]}
            status:
              type: object
              properties:
                agentUID: {type: string}
                observedGeneration: {type: integer, format: int64, minimum: 0}
                packageDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                member: {type: string}
                resolvedBindingDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                revisionDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                harnessName: {type: string}
                servedDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                conditions:
                  type: array
                  maxItems: 2
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string, enum: [PackageVerified, Registered]}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message: {type: string, maxLength: 32768}
