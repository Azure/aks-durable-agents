{{- if ne .Values.runtime.mode "substrate" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents.name" . }}-harness
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
{{- end }}
