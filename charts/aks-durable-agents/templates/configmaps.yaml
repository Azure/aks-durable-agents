{{- $name := include "agents.name" . -}}
{{- $pricing := .Values.model.policy.pricing -}}
{{- $policy := dict "version" 1 "runID" .Values.model.policy.runID "ledgerPath" "/data/real-attempts.db" "deployment" .Values.model.deployment "pricing" $pricing -}}
{{- if eq (int (default 2 .Values.model.policy.maxAttempts)) 3 -}}
{{- $_ := set $policy "version" 2 -}}
{{- $_ := set $policy "maxAttempts" 3 -}}
{{- end -}}
{{- if hasKey .Values.model.policy "maxInputTokens" -}}
{{- $_ := set $policy "maxInputTokens" .Values.model.policy.maxInputTokens -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-model-policy
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
immutable: true
data:
  model-policy.json: {{ $policy | toJson | quote }}
{{- if eq .Values.auth.mode "required" }}
{{- range .Values.auth.approvers }}
{{- if ne .issuer $.Values.auth.issuer }}{{ fail "auth.approvers issuer must equal auth.issuer exactly" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-auth
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
immutable: true
data:
  {{- $identity := dict "tenantID" .Values.auth.tenantID "issuer" .Values.auth.issuer "audience" .Values.auth.audience "allowedClientIDs" .Values.auth.allowedClientIDs "requiredScope" .Values.auth.requiredScope "subjectClaim" .Values.auth.subjectClaim }}
  {{- range $key := list "requiredRoles" "requiredGroups" "memberOnly" "approverRoles" }}
  {{- if index $.Values.auth $key }}{{ $_ := set $identity $key (index $.Values.auth $key) }}{{ end }}
  {{- end }}
  auth.json: {{ dict "identity" $identity "approvers" .Values.auth.approvers | toJson | quote }}
{{- end }}
