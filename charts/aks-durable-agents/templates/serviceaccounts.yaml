apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents.name" . }}-host
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientID | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents.name" . }}-{{ ternary "executor" "harness" (eq .Values.runtime.mode "substrate") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
automountServiceAccountToken: false
