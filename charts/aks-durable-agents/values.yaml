# Operator identity/model inputs remain required: bare lint/template must refuse.
image:
  host:
    repository: "ghcr.io/azure/aks-durable-agents/host"
    digest: "sha256:de4de638b95fc615f51e23e5fc014820cb83a4d3ff5daf3b009434e6ced5d165"
    # Operator attestation: legacy /session-fixture probe, or native /host health-probe.
    includesHealthProbe: true
  harness:
    repository: "ghcr.io/azure/aks-durable-agents/session-fixture"
    digest: "sha256:901a7d19137ca215fb3b57c291e878e48946d624941d005df5e64717b4a5ee03"

# Install dormant. Apply/verify policies before enabling workloads (see README).
workloads:
  enabled: false

auth:
  mode: required
  trustedNetwork: false
  tenantID: ""
  issuer: ""
  audience: ""
  allowedClientIDs: []
  requiredScope: ""
  subjectClaim: oid
  # Optional: any caller role, all group IDs, explicit acct=0 membership.
  requiredRoles: []
  requiredGroups: []
  memberOnly: false
  # Any approver role OR a listed subject grants approval (see docs/entraauth.md).
  approverRoles: []
  approvers: []
  # Existing Secret with tls.crt and tls.key; never put key material in values.
  tlsSecretName: ""

workloadIdentity:
  clientID: ""

model:
  endpoint: ""
  deployment: ""
  scope: https://ai.azure.com/.default
  policy:
    runID: ""
    # Total dispatch attempts, not retries: 2 selects policy v1; 3 selects v2.
    maxAttempts: 2
    # Opt-in for a new run only; omission retains the 8192 input-token bound.
    # maxInputTokens: 32768
    pricing:
      inputMicroUSDPerMillionTokens: 0
      outputMicroUSDPerMillionTokens: 0
      extraMicroUSDPerCall: 0
      source: ""
      asOf: ""

persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: managed-csi
  # Must be prepared separately; never reuse a prior run's subtree for a new run.
  subPath: sessions-v1

runtime:
  # Substrate is explicit and incompatible with native producers/remote harnesses.
  mode: remote
  substrate:
    atespace: ""
    templateAtespace: ""
    template: ""

harness:
  # Opt-in native producer profile. Entries must match the prepared inventory.
  native:
    enabled: false
    inventory: /data/producers/inventory.json
    entries: []
  name: release-notes
  command: /session-fixture
  args:
    - harness
    - --scenario
    - v2
    - --addr
    - 0.0.0.0:9000
    - --instructions
    - /data/instructions.txt
    - --node-name
    - $(NODE_NAME)
    - --pod-uid
    - $(POD_UID)
  executor:
    command: /session-fixture
    args: [executor, --scenario, v2, --socket, /data/publish.sock, --database, /data/publications.db]
  # Reference inert fake is only reachable on the harness pod's own loopback.
  fake:
    command: /session-fixture
    args: [fake, --addr, "127.0.0.1:9001", --ledger, /data/fake-calls.jsonl]

networkPolicy:
  enabled: true

# Explicit private TLS, native-harness, auth-off profile. Never an auth boundary.
canvas:
  image:
    repository: ""
    digest: ""
    # Attest the reviewed image owns the HTTP /readyz health-probe command.
    includesHealthProbe: false
  enabled: false
  instanceID: ""
  # HTTPS literal-loopback origin; local port-forward port, not necessarily 8443.
  origin: ""
  # Existing host Secret: exact Service DNS SAN, tls.crt/tls.key and ca.crt.
  sessionsTLSSecretName: ""
  # Separate engine Secret: IP SAN 127.0.0.1, tls.crt/tls.key.
  tlsSecretName: ""
  persistence:
    existingClaim: ""
    size: 1Gi
    storageClass: managed-csi
